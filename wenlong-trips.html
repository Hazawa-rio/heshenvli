  .trip{margin:0; background:#fff; border:1px solid #E2D4B5; border-radius:8px; padding:10px 10px 6px; box-shadow:0 2px 0 #E2D4B5;}
  .trip .shot{aspect-ratio:4/3; background:#E9DFC6; border-radius:4px; display:flex; align-items:center; justify-content:center; color:#A8946A; font-size:13px;}
  .trip figcaption{text-align:center; font-size:13px; color:#8A7456; padding-top:6px; font-family:"Noto Serif TC",serif;}
  html.eye, html.eye *{cursor:url(assets/eye.png) 36 24, auto !important;}
  .eye-text{position:fixed; z-index:99999; pointer-events:none; color:#D8261E; font-weight:700; font-family:"Noto Serif TC",serif; text-shadow:0 0 6px rgba(0,0,0,.8); white-space:nowrap; animation:eyefade 2s ease-out forwards;}
  @keyframes eyefade{0%{opacity:0; transform:scale(.8);} 15%{opacity:1;} 100%{opacity:0; transform:scale(1.15);}}
  .clue-note{position:fixed; right:20px; bottom:20px; z-index:120;}
  .clue-note-toggle{
    width:52px; height:52px; border-radius:50%;
    background:#F4D35E; border:none; box-shadow:0 4px 14px rgba(0,0,0,.25);
    font-size:22px; cursor:pointer; line-height:1;
  }
  .clue-note-toggle:hover{background:#E9C13F;}
  .clue-note-panel{
    position:absolute; right:0; bottom:64px;
    width:260px; background:#FDF6D8; border:1px solid #E4D48A;
    box-shadow:0 10px 26px rgba(0,0,0,.25); padding:12px;
  }
  .clue-note-head{
    display:flex; justify-content:space-between; align-items:center;
    font-size:13px; font-weight:700; color:#6B5A1E; margin-bottom:8px;
  }
  .clue-note-close{background:none; border:none; font-size:14px; cursor:pointer; color:#6B5A1E; padding:0;}
  #clueNoteText{
    width:100%; min-height:140px; resize:vertical; box-sizing:border-box;
    border:1px solid #E4D48A; background:#FFFDF0;
    font-family:inherit; font-size:13px; padding:8px; outline:none;
    color:#3A3220;
  }
  @media (max-width:480px){
    .clue-note-panel{width:calc(100vw - 40px);}
  }
</style>

<script>
  /* 編號對應字母：10-15-9-14 21-19 = JOIN US。只有這六張（data-correct）是對的。
     在「錯誤的地方」按 F12（或開發者工具快捷鍵）→ 滑鼠變成眼睛，周圍彈出紅字。 */
  var mx = window.innerWidth / 2, my = window.innerHeight / 2;
  var eyeTimer = null, eyeUntil = 0;
  var EYE_LINES = ["你到底想看哪裡？", "你在看哪裡？", "你看錯方向了？", "你難道想看見裡面嗎？"];

  document.addEventListener("mousemove", function(e){ mx = e.clientX; my = e.clientY; }, {passive:true});

  function startEye(){
    document.documentElement.classList.add("eye");
    eyeUntil = Date.now() + 10000;
    if (eyeTimer) return;
    eyeTimer = setInterval(function(){
      if (Date.now() > eyeUntil){
        clearInterval(eyeTimer); eyeTimer = null;
        document.documentElement.classList.remove("eye");
        return;
      }
      var el = document.createElement("div");
      el.className = "eye-text";
      el.textContent = EYE_LINES[Math.floor(Math.random() * EYE_LINES.length)];
      var ang = Math.random() * Math.PI * 2, r = 50 + Math.random() * 90;
      el.style.left = Math.max(4, mx + Math.cos(ang) * r - 40) + "px";
      el.style.top = Math.max(4, my + Math.sin(ang) * r) + "px";
      el.style.fontSize = (15 + Math.floor(Math.random() * 9)) + "px";
      document.body.appendChild(el);
      setTimeout(function(){ el.remove(); }, 2000);
    }, 260);
  }

  function isDevtoolsKey(e){
    if (e.key === "F12") return true;
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && /^[ijc]$/i.test(e.key)) return true;
    if (e.metaKey && e.altKey && /^[ijc]$/i.test(e.key)) return true;
    return false;
  }

  document.addEventListener("keydown", function(e){
    if (!isDevtoolsKey(e)) return;
    var under = document.elementFromPoint(mx, my);
    var right = under && under.closest && under.closest('.trip[data-correct="1"]');
    if (!right) startEye();
  });
</script>

<div class="clue-note" id="clueNote">
    <button type="button" class="clue-note-toggle" id="clueNoteToggle" aria-label="開啟線索便簽">📝</button>
    <div class="clue-note-panel" id="clueNotePanel" hidden>
      <div class="clue-note-head">
        <span>線索便簽</span>
        <button type="button" class="clue-note-close" id="clueNoteClose" aria-label="關閉便簽">✕</button>
      </div>
      <textarea id="clueNoteText" placeholder="在這裡記下你發現的線索…" spellcheck="false"></textarea>
    </div>
  </div>

  <script>
  (function(){
    var CLUE_NOTE_KEY = "heshanliClueNotes";
    var toggle = document.getElementById("clueNoteToggle");
    var panel = document.getElementById("clueNotePanel");
    var closeBtn = document.getElementById("clueNoteClose");
    var textarea = document.getElementById("clueNoteText");

    try {
      var saved = localStorage.getItem(CLUE_NOTE_KEY);
      if (saved !== null) textarea.value = saved;
    } catch (err){ /* 忽略無法讀取的情況 */ }

    toggle.addEventListener("click", function(){
      panel.hidden = !panel.hidden;
    });
    closeBtn.addEventListener("click", function(){
      panel.hidden = true;
    });
    textarea.addEventListener("input", function(){
      try { localStorage.setItem(CLUE_NOTE_KEY, textarea.value); }
      catch (err){ /* 忽略無法寫入的情況 */ }
    });
  })();
  </script>
