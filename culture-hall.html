<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>和善里文化展館 · 官方網站</title>
<meta name="description" content="和善里文化展館，訴說小鎮百年來的故事。">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F3E8;
    --ink:#2B2A25;
    --ink-soft:#5B5647;
    --pine:#3F5C4E;
    --pine-dark:#2A4038;
    --line:#D9CFB4;
    --font-display:'Noto Serif TC', serif;
    --font-body:'Noto Sans TC', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.75;
  }
  .wrap{max-width:820px; margin:0 auto; padding:0 24px;}
  .topbar{background:var(--pine-dark); color:#F1EAD6;}
  .topbar .wrap{padding:16px 24px;}
  .brand{font-family:var(--font-display); font-weight:700; font-size:19px;}

  .hero{
    position:relative;
    min-height:320px;
    display:flex;
    align-items:flex-end;
    background-size:cover;
    background-position:center;
  }
  .hero::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(20,14,8,.1) 0%, rgba(20,14,8,.7) 100%);
  }
  .hero .wrap{position:relative; z-index:1; padding-bottom:32px;}
  .hero h1{
    font-family:var(--font-display);
    font-weight:900;
    color:#FBF7EC;
    font-size:clamp(28px, 4.5vw, 42px);
    margin:0;
  }

  .notice{
    text-align:center;
    padding:70px 24px;
  }
  .notice .tag{
    display:inline-block;
    font-size:12.5px;
    font-weight:700;
    color:var(--pine);
    border:1px solid var(--pine);
    padding:4px 14px;
    margin-bottom:18px;
  }
  .notice h2{
    font-family:var(--font-display);
    font-size:24px;
    margin:0 0 12px;
  }
  .notice p{color:var(--ink-soft); max-width:52ch; margin:0 auto;}

  footer{padding:24px 0 40px; text-align:center; font-size:12px; color:#A79A78;}
</style>
</head>
<body>

  <div class="topbar"><div class="wrap"><div class="brand">和善里文化展館</div></div></div>

  <div class="hero" style="background-image:url('assets/culture-hall.jpg');">
    <div class="wrap">
      <h1>和善里文化展館</h1>
    </div>
  </div>

  <div class="notice">
    <span class="tag">建置中</span>
    <h2>展館內容整理中，敬請期待</h2>
    <p>和善里文化展館的完整內容正在籌備，之後會在這裡呈現小鎮的百年故事。</p>
  </div>

  <footer>© 2026 和善里文化展館。本頁面內容均為虛擬創作。</footer>

</body>
</html>
